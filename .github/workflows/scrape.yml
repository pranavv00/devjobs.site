name: Refresh job listings
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-snapshot-update
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - run: python -m unittest discover -s agent/tests -v
      - run: python -m agent.main --report scrape-report.json
      - name: Keep source health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report
          path: scrape-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit a successful snapshot
        run: |
          if git diff --quiet -- src/lib/jobs.json; then
            echo 'No listing changes'
            exit 0
          fi
          git config user.name 'DevJobs Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/jobs.json
          git commit -m 'chore: refresh job listings'
          git pull --rebase origin main
          git push origin HEAD:main
